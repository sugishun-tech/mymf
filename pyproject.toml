[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mymf"
version = "0.1.0"
description = "CPU-first dynamic-shift randomized matrix factorization with Cython/OpenMP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "mymf contributors"}]
keywords = ["svd", "matrix-factorization", "recommendation", "cython", "randomized-linear-algebra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.6", "threadpoolctl>=3.2", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mymf = ["*.pyx", "*.h", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
